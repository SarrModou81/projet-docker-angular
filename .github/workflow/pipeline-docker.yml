name: Build and Push Angular Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # --- Notification Slack : début du build ---
      - name: Notify Slack - build started
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "Nouveau build en cours pour *${{ github.repository }}* sur la branche *${{ github.ref_name }}* (commit `${{ github.sha }}`)."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            mds81/projet-angular-docker-miage:latest
            mds81/projet-angular-docker-miage:${{ github.sha }}

      # --- Notification Slack : succès de la publication ---
      - name: Notify Slack - success
        if: success()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "Image Docker publiée avec succès pour *${{ github.repository }}* (branche `${{ github.ref_name }}`, tag `${{ github.sha }}`).\nVoir l'exécution : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK