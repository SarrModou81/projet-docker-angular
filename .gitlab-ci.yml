stages:
  - install
  - test
  - build
  - quality
  - docker
  - notify

variables:
  DOCKER_IMAGE: mds81/projet-angular-docker-miage
  DOCKER_TLS_CERTDIR: "/certs"

default:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

install_dependencies:
  stage: install
  image: node:22-alpine
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

unit_tests:
  stage: test
  image: markhobson/node-chrome:22
  needs: ["install_dependencies"]
  script:
    - npm test -- --no-watch --no-progress --browsers=ChromeHeadless

build_app:
  stage: build
  image: node:22-alpine
  needs: ["install_dependencies"]
  script:
    - npm run build -- --configuration production
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

sonarqube_check:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  needs: ["build_app"]
  variables:
    SONAR_TOKEN: $SONAR_TOKEN
    SONAR_HOST_URL: $SONAR_HOST_URL
  script:
    - sonar-scanner
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

docker_build_push:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  needs: ["build_app"]
  script:
    - docker login -u "$DOCKER_HUB_USERNAME" -p "$DOCKER_HUB_PASSWORD"
    - docker build -t "$DOCKER_IMAGE:latest" -t "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$DOCKER_IMAGE:latest"
    - docker push "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

notify_slack:
  stage: notify
  image: alpine:latest
  needs: ["docker_build_push"]
  before_script:
    - apk add --no-cache curl
  script:
    - >
      curl -X POST -H 'Content-type: application/json'
      --data "{\"text\":\":white_check_mark: Image Docker publiee avec succes pour $CI_PROJECT_NAME (branche $CI_COMMIT_REF_NAME, tag $CI_COMMIT_SHORT_SHA). Pipeline: $CI_PIPELINE_URL\"}"
      "$SLACK_WEBHOOK_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
